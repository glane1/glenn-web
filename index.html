<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff758f;
            --text: #4a4a4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fceef5 0%, #ffcfd2 100%);
            font-family: 'Quicksand', sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 40px 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(255, 77, 109, 0.2);
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: all 0.3s ease;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2rem, 8vw, 3rem);
            color: #d63384;
        }

        #status-msg {
            font-size: 1.1rem;
            color: #666;
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* This container manages the button sizes relative to each other */
        .btn-container {
            display: flex;
            flex-wrap: wrap; 
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        #yesBtn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 117, 143, 0.3);
            transition: all 0.3s ease-out;
            white-space: normal;
        }

        #noBtn {
            background: white;
            color: #666;
            border: 1px solid #ddd;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease-out;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #success-overlay {
            position: fixed;
            inset: 0;
            background: #ffe5ec;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .floating-heart {
            position: fixed;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            z-index: 5;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh); opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>Will you be mine?</h1>
        <p id="status-msg">I promise it'll be the best decision! ✨</p>
        
        <div class="btn-container">
            <button id="yesBtn" onclick="celebrate()">Yes, I'd love to! ❤️</button>
            <button id="noBtn" onclick="handleNo()">No, thank you</button>
        </div>
    </div>

    <div id="success-overlay">
        <h1 style="font-size: 3rem; color: #d63384;">Yay! 💖</h1>
        <p style="font-size: 1.5rem; color: #ff758f; margin-top: 10px;">See you on Valentine's Day!</p>
    </div>

    <script>
        let yesSize = 1;
        let noSize = 0.9;
        let paddingV = 15;
        let paddingH = 30;

        const subtlePleas = [
            "Are you sure? 🥺",
            "Chocolates are waiting! 🍫",
            "But we're a match! 🎀",
            "Don't say no... 💔",
            "Please? ✨",
            "One more chance? 🌹"
        ];
        let pleaIdx = 0;

        function handleNo() {
            const yes = document.getElementById('yesBtn');
            const no = document.getElementById('noBtn');
            const status = document.getElementById('status-msg');

            // 1. Make Yes bigger
            yesSize += 0.2;
            paddingV += 8;
            paddingH += 12;
            yes.style.fontSize = `${yesSize}rem`;
            yes.style.padding = `${paddingV}px ${paddingH}px`;

            // 2. Make No smaller
            noSize -= 0.1;
            if (noSize < 0.4) {
                no.style.display = 'none'; // Completely hide if too small
            } else {
                no.style.fontSize = `${noSize}rem`;
                no.style.padding = `${5 + (noSize * 5)}px ${10 + (noSize * 10)}px`;
            }

            // 3. Update text
            status.innerText = subtlePleas[pleaIdx];
            pleaIdx = (pleaIdx + 1) % subtlePleas.length;
        }

        function celebrate() {
            document.getElementById('success-overlay').style.display = 'flex';
            for(let i = 0; i < 30; i++) {
                setTimeout(spawnHeart, i * 100);
            }
        }

        function spawnHeart() {
            const h = document.createElement('div');
            h.className = 'floating-heart';
            h.innerHTML = ['❤️', '💖', '✨', '🌸'][Math.floor(Math.random() * 4)];
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = (Math.random() * 20 + 20) + 'px';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 4000);
        }
    </script>
</body>
</html>
